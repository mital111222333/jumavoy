# JUMAVOY (ai-bot — the owner's assistant, team-bot — the agents' one): tests on every push, live on main.
# A red mark on the commit = something an update broke. The CRM itself lives in mital111222333/MitalCRM.
name: checks
on: [push, pull_request]
jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: JUMAVOY tests
        working-directory: supabase/functions/ai-bot
        run: deno test -A index.test.ts
  team-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: JUMAVOY for the team — tests
        working-directory: supabase/functions/team-bot
        run: deno test -A index.test.ts
  # JUMAVOY goes live by itself: after the bot tests pass on main, the function is deployed to Supabase.
  # Needs the repository secret SUPABASE_ACCESS_TOKEN (supabase.com → Account → Access Tokens); without it the step is skipped.
  deploy-bot:
    needs: bot
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: deploy ai-bot
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "SUPABASE_ACCESS_TOKEN is not set — skipping deploy"; exit 0; fi
          npx -y supabase@latest functions deploy ai-bot --remote=oxchgcfyzszemqlvdjjr --no-verify-jwt --use-api --yes
  # the agents' JUMAVOY (team-bot) goes live the same way after its own tests (it used to be deployed by hand and fell behind)
  deploy-team-bot:
    needs: team-bot
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: deploy team-bot
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "SUPABASE_ACCESS_TOKEN is not set — skipping deploy"; exit 0; fi
          npx -y supabase@latest functions deploy team-bot --remote=oxchgcfyzszemqlvdjjr --no-verify-jwt --use-api --yes
  # account management (Пользователи): type check, then live on main the same way as the bots (it checks the caller's login itself)
